[package]
name = "brass-lab-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

# Standalone additive collector; lab builds place the unchanged B01 archive at
# ../native. No installed-game or shared-core source is changed by B02.
[workspace]

[features]
# Teacher bindings echo f64 budgets through Python JSON. Preserve every bit on
# decode so an unchanged reply cannot be mistaken for a stale identity. Keep
# Ordinary behavior probabilities need the same exact decoding in the new wire.
default = ["serde_json/float_roundtrip"]
teacher = ["serde_json/float_roundtrip"]

[[bin]]
name = "brass-lab-teacher"
path = "src/bin/teacher.rs"
required-features = ["teacher"]

[dependencies]
brass-ai-core = { path = "../native/brass-ai-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
